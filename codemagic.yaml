workflows:

  # ── iOS ──────────────────────────────────────────────────────────────────────
  ios-release:
    name: iOS Release (TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Linq App Store Connect Key   # set up in Codemagic UI
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: co.uk.adastranetwork.linq
      vars:
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
      node: 20.17.0
    scripts:
      - name: Install Node dependencies
        script: npm ci
      - name: Build web app
        script: npm run build
      - name: Capacitor sync iOS
        script: npx cap sync ios
      - name: Set bundle version
        script: |
          BUILD=$(( $(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID") + 1 ))
          xcrun agvtool new-version -all $BUILD
      - name: Build & sign iOS
        script: |
          xcode-project use-profiles
          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath build/App.xcarchive \
            archive
          xcodebuild \
            -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist /Users/builder/export_options.plist \
            -exportPath build/ipa
    artifacts:
      - build/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  # ── Android ──────────────────────────────────────────────────────────────────
  android-release:
    name: Android Release (Play Store)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      android_signing:
        - linqandroid
      vars:
        PACKAGE_NAME: co.uk.adastranetwork.linq
      node: 20.17.0
    scripts:
      - name: Install Node dependencies
        script: npm ci
      - name: Build web app
        script: npm run build
      - name: Capacitor sync Android
        script: npx cap sync android
      - name: Build Android release AAB
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
