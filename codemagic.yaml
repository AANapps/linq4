workflows:

  # ── iOS ──────────────────────────────────────────────────────────────────────
  ios-release:
    name: iOS Release (TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: co.uk.adastranetwork.linq
      groups:
        - firebase IOS
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
      node: 22.13.0
    scripts:
      - name: Install Node dependencies
        script: npm ci
      - name: Strip Google/Facebook SDKs from Firebase auth plugin
        script: cp scripts/firebase-auth-plugin-package.swift node_modules/@capacitor-firebase/authentication/Package.swift
      - name: Build web app
        script: npm run build
      - name: Capacitor sync iOS
        script: npx cap sync ios
      - name: Build & sign iOS
        script: |
          set -e
          xcode-project use-profiles
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            -allowProvisioningUpdates \
            archive | xcpretty && exit ${PIPESTATUS[0]}
          xcodebuild \
            -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist /Users/builder/export_options.plist \
            -exportPath build/ipa
    artifacts:
      - build/ipa/*.ipa

  # ── Android ──────────────────────────────────────────────────────────────────
  android-release:
    name: Android Release (Play Store)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      android_signing:
        - linqandroid
      vars:
        PACKAGE_NAME: co.uk.adastranetwork.linq
      node: 22.13.0
      java: 21
    scripts:
      - name: Install Node dependencies
        script: npm ci
      - name: Build web app
        script: npm run build
      - name: Capacitor sync Android
        script: npx cap sync android
      - name: Build Android release AAB
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
