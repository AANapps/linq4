<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Linq Vendor</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      :root {
        --color-brand-navy: #0F172A;
        --color-brand-gold: #0D9488;
        --color-brand-bg: #FFFFFF;
        --color-brand-crimson: #0F766E;
        --color-brand-rose: #CCFBF1;
      }
    </style>
    <script>
      try {
        var v = JSON.parse(localStorage.getItem('linq_brand_vars') || 'null');
        if (v) {
          var r = document.documentElement;
          r.style.setProperty('--brand-g1', v.g1);
          r.style.setProperty('--brand-g2', v.g2);
          r.style.setProperty('--brand-g3', v.g3);
          r.style.setProperty('--brand-g4', v.g4);
          r.style.setProperty('--color-brand-gold', v.gold);
          r.style.setProperty('--color-brand-crimson', v.crimson);
          r.style.setProperty('--color-brand-rose', v.rose);
        }
      } catch(e) {}
    </script>
  </head>
  <body>
    <svg aria-hidden="true" focusable="false" style="position:absolute;width:0;height:0;overflow:hidden">
      <defs>
        <filter id="liquid-glass-distortion" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.009 0.013" numOctaves="2" seed="7" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="16" xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </defs>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
